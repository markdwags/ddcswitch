name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege by default; only the release job can write.
permissions:
  contents: read

# Superseded PR/branch runs are cancelled; runs on main always finish (they may be releasing).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PUBLISH_DIR: DDCSwitch/bin/Release/net10.0/win-x64/publish

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_needed: ${{ steps.version.outputs.release_needed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        # High/critical NuGet advisories fail the build instead of scrolling by as warnings.
        run: dotnet restore DDCSwitch.sln -r win-x64 "-p:WarningsAsErrors=NU1903%3BNU1904"

      - name: Test
        run: >
          dotnet test --project DDCSwitch.Tests -c Release --no-restore
          --results-directory TestResults
          --report-xunit-trx
          --report-xunit-markdown --report-xunit-markdown-filename summary.md
          --coverlet --coverlet-output-format cobertura

      - name: Publish test summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (Test-Path TestResults/summary.md) { Get-Content TestResults/summary.md >> $env:GITHUB_STEP_SUMMARY }

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.sha }}
          path: TestResults/
          retention-days: 7

      - name: Build Release (NativeAOT)
        run: dotnet publish DDCSwitch/DDCSwitch.csproj -c Release -r win-x64 --no-restore

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "$env:PUBLISH_DIR/ddcswitch.exe"
          if (-not (Test-Path $exe)) { Write-Error "Build failed - $exe not found"; exit 1 }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "✓ Executable size: $size MB"
          # Smoke test: the AOT binary starts and runs (no monitors are needed for this command).
          & $exe --json version
          if ($LASTEXITCODE -ne 0) { Write-Error "ddcswitch.exe version exited with $LASTEXITCODE"; exit 1 }

      - name: Determine version and whether to release
        id: version
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch '\[(\d+\.\d+\.\d+)\]') { Write-Error "Could not find version in CHANGELOG.md"; exit 1 }
          $version = $matches[1]
          $tagExists = [bool](git ls-remote --tags origin "refs/tags/v$version")
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_needed=$((-not $tagExists).ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($tagExists) {
            "Version **$version** is already released; merging to main will not create a release." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Version **$version** is new; merging to main will release **v$version**." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DDCSwitch-build-${{ github.sha }}
          path: ${{ env.PUBLISH_DIR }}/ddcswitch.exe
          retention-days: 7

  release:
    needs: build
    runs-on: windows-latest
    # Only when main gets a CHANGELOG version that has no tag yet.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.release_needed == 'true'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: DDCSwitch-build-${{ github.sha }}
          path: artifact/

      - name: Package release
        id: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item artifact/ddcswitch.exe, README.md, LICENSE, EXAMPLES.md, CHANGELOG.md release/
          $zip = "ddcswitch-$env:VERSION-win-x64.zip"
          Compress-Archive -Path release/* -DestinationPath $zip
          $checksum = (Get-FileHash $zip -Algorithm SHA256).Hash
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256 ($zip): $checksum"

      - name: Extract release notes
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $escaped = [regex]::Escape($env:VERSION)
          # Everything between this version's "## [x.y.z]" heading and the next "## [" heading.
          $match = [regex]::Match($changelog, "(?ms)^## \[$escaped\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($match.Success -and $match.Groups[1].Value.Trim()) { $match.Groups[1].Value.Trim() } else { "Release version $env:VERSION" }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Build Chocolatey package
        shell: pwsh
        run: |
          $checksum = "${{ steps.package.outputs.checksum }}"
          (Get-Content chocolatey\ddcswitch.nuspec -Raw) -replace '__VERSION__', $env:VERSION | Set-Content chocolatey\ddcswitch.nuspec -NoNewline
          # Checksum is embedded in the install script (Chocolatey validation CPMR0073)
          (Get-Content chocolatey\tools\chocolateyinstall.ps1 -Raw) -replace '__CHECKSUM__', $checksum | Set-Content chocolatey\tools\chocolateyinstall.ps1 -NoNewline
          (Get-Content chocolatey\tools\VERIFICATION.txt -Raw) -replace '__VERSION__', $env:VERSION -replace '__CHECKSUM__', $checksum | Set-Content chocolatey\tools\VERIFICATION.txt -NoNewline

          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }

          Push-Location chocolatey
          choco pack
          Pop-Location
          if (-not (Test-Path "chocolatey/ddcswitch.$env:VERSION.nupkg")) { Write-Error "Failed to create Chocolatey package"; exit 1 }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ddcswitch ${{ env.VERSION }}
          body_path: release-notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.zip }}
            release/ddcswitch.exe
            chocolatey/ddcswitch.${{ env.VERSION }}.nupkg

      - name: Upload Chocolatey package
        uses: actions/upload-artifact@v7
        with:
          name: chocolatey-package-${{ env.VERSION }}
          path: chocolatey/*.nupkg
          retention-days: 90
