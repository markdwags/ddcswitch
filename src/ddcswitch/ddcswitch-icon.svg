<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ddcswitch">
  <title>ddcswitch</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A3FE8"/>
      <stop offset="1" stop-color="#3A1C9E"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2327"/>
      <stop offset="1" stop-color="#14181B"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- monitor bezel -->
  <rect x="40" y="52" width="176" height="120" rx="14" fill="#F4F2FF"/>
  <!-- screen -->
  <rect x="50" y="62" width="156" height="100" rx="7" fill="url(#screen)"/>

  <!-- stand -->
  <path d="M112 172 h32 l6 26 h-44 z" fill="#F4F2FF"/>
  <rect x="88" y="196" width="80" height="12" rx="6" fill="#F4F2FF"/>

  <!-- switch arrows -->
  <g fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- top: right-pointing -->
    <path d="M82 96 H170" stroke="#4ADE80"/>
    <path d="M152 80 L172 96 L152 112" stroke="#4ADE80"/>
    <!-- bottom: left-pointing -->
    <path d="M174 132 H86" stroke="#60A5FA"/>
    <path d="M104 116 L84 132 L104 148" stroke="#60A5FA"/>
  </g>
</svg>
